[project]
name = "app-fichaje-backend"
version = "0.1.0"
description = "API de la aplicación de control horario multiempresa"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # Preparadas para las fases de base de datos (todavía sin modelos ni migraciones).
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",  # necesario para el TestClient de FastAPI
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
